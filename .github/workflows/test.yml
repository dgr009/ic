name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Install package in editable mode
      run: |
        pip install -e .
    
    - name: Create example config files
      run: |
        mkdir -p .ic/config config
        # Support both new and legacy paths for testing
        if [ -f config/secrets.yaml.example ]; then
          cp config/secrets.yaml.example config/secrets.yaml
        fi
        if [ -f .ic/config/secrets.yaml.example ]; then
          cp .ic/config/secrets.yaml.example .ic/config/secrets.yaml
        fi
    
    - name: Verify package installation
      run: |
        python -c "import ic; print('IC package imported successfully')"
        python -c "from ic.config.manager import ConfigManager; print('ConfigManager imported successfully')"
        python -c "import netifaces; print('netifaces imported successfully')"
    
    - name: Run tests
      run: |
        # Set PYTHONPATH to ensure imports work
        export PYTHONPATH="${PYTHONPATH}:${PWD}/src"
        # Run only basic tests
        pytest tests/test_basic.py -v --tb=short
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella