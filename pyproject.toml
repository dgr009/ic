[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic"
version = "1.0.0"
authors = [
    {name = "SangYun Kim", email = "cruiser594@gmail.com"},
]
description = "A comprehensive CLI tool for managing cloud infrastructure resources across AWS, Azure, GCP, OCI, and CloudFlare with built-in security features"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Security",
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: Korean",
]
keywords = [
    "aws", "azure", "gcp", "oci", "cloudflare", 
    "infrastructure", "cli", "cloud", "devops",
    "multi-cloud", "resource-management", "security",
    "configuration", "monitoring", "automation",
    "kubernetes", "containers", "serverless"
]
dependencies = [
    # Core Cloud SDKs
    "boto3>=1.40.0,<1.41.0",
    "oci>=2.149.0,<2.150.0",
    "requests>=2.32.0,<2.33.0",
    "kubernetes>=29.0.0,<30.0.0",
    "awscli>=1.42.0,<1.43.0",
    
    # Google Cloud SDKs
    "google-cloud-compute>=1.36.0,<1.37.0",
    "google-cloud-container>=2.44.0,<2.45.0",
    "google-cloud-storage>=2.18.0,<2.19.0",
    "google-cloud-functions>=1.16.0,<1.17.0",
    "google-cloud-run>=0.11.0,<0.12.0",
    "google-cloud-billing>=1.13.0,<1.14.0",
    "google-cloud-resource-manager>=1.12.0,<1.13.0",
    "google-auth>=2.29.0,<2.30.0",
    "google-auth-oauthlib>=1.2.0,<1.3.0",
    "google-auth-httplib2>=0.2.0,<0.3.0",
    
    # Azure SDKs
    "azure-identity>=1.15.0,<2.0.0",
    "azure-mgmt-compute>=29.0.0,<30.0.0",
    "azure-mgmt-network>=24.0.0,<25.0.0",
    "azure-mgmt-containerinstance>=10.0.0,<11.0.0",
    "azure-mgmt-containerservice>=28.0.0,<29.0.0",
    "azure-mgmt-storage>=21.0.0,<22.0.0",
    "azure-mgmt-sql>=3.0.0,<4.0.0",
    "azure-mgmt-rdbms>=10.0.0,<11.0.0",
    "azure-mgmt-eventhub>=10.0.0,<11.0.0",
    "azure-mgmt-resource>=22.0.0,<23.0.0",
    "azure-mgmt-subscription>=3.0.0,<4.0.0",
    
    # SSH and Network
    "paramiko>=4.0.0,<5.0.0",
    
    # CLI User Interface and Output
    "rich>=14.0.0,<15.0.0",
    "InquirerPy>=0.3.4,<0.4.0",
    "tqdm>=4.67.0,<4.68.0",
    
    # Configuration and Utilities
    "python-dotenv>=1.1.0,<1.2.0",
    "python-dateutil>=2.9.0,<2.10.0",
    "PyYAML>=6.0.0,<=6.0.1",
    "click>=8.0.0,<=8.0.4",
    "docutils>=0.18.1,<=0.19",
    "invoke>=2.2.0,<2.3.0",
    
    # Security and Validation
    "jsonschema>=4.23.0,<5.0.0",
    "cryptography>=42.0.0,<43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "black>=24.8.0,<25.0.0",
    "flake8>=7.1.0,<8.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pre-commit>=3.8.0,<4.0.0",
    "build>=1.2.0,<2.0.0",
    "twine>=5.1.0,<6.0.0",
]
test = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]
security = [
    "bandit>=1.7.0,<2.0.0",
    "safety>=3.2.0,<4.0.0",
    "semgrep>=1.45.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/dgr009/ic"
Repository = "https://github.com/dgr009/ic"
Issues = "https://github.com/dgr009/ic/issues"
Documentation = "https://github.com/dgr009/ic#readme"
Security = "https://github.com/dgr009/ic/blob/main/docs/security.md"
"Configuration Guide" = "https://github.com/dgr009/ic/blob/main/docs/configuration.md"
"Migration Guide" = "https://github.com/dgr009/ic/blob/main/docs/migration.md"
Changelog = "https://github.com/dgr009/ic/blob/main/CHANGELOG.md"

[project.scripts]
ic = "ic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ic = ["config/*.yaml", "config/*.json", "config/examples/*.yaml"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "oci.*",
    "azure.*",
    "google.*",
    "paramiko.*",
    "InquirerPy.*",
]
ignore_missing_imports = true